# This repository is a generated mirror.
#
# Every file outside `.github/` is produced by the SDK generator in
# Infrawrench/Infrawrench and replaced wholesale on each release, so a change
# made here would be silently overwritten by the next publish. GitHub offers no
# way to disable pull requests on a public repository — forking can only be
# turned off for private ones — so incoming pull requests are closed with a
# pointer to the place a change can actually survive.
name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      # `pull_request_target` runs in the base repository's context, which is
      # what grants the write permission needed to close a fork's pull request.
      # Nothing from the fork is checked out or executed, so the usual hazard of
      # that trigger does not apply here.
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "Thanks for the interest — but this repository is a **generated mirror**.",
              "",
              "Everything here is emitted by the SDK generator in",
              "[Infrawrench/Infrawrench](https://github.com/Infrawrench/Infrawrench) and is replaced in full",
              "on every release, so a change merged here would disappear at the next publish.",
              "",
              "To change the client, change the generator:",
              "`app/packages/web/scripts/sdk/targets/` in the main repository.",
              "To report a bug, open an issue there.",
              "",
              "Closing automatically — no action needed from you.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: "closed",
            });
